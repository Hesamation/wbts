name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  contract-simulator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check CLI verifier identity
        run: python3 scripts/sync-verifier-pin.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev cmake pkg-config libssl-dev libdbus-1-dev libudev-dev
      - name: Install B1 toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default 1.99.1
          cargo install cargo-near --version 0.23.0 --locked
      - name: Build contract and test simulator
        run: |
          cargo near build non-reproducible-wasm --manifest-path contract/Cargo.toml --locked
          cargo near build non-reproducible-wasm --manifest-path data-escrow/Cargo.toml --locked
          node data-escrow/compat/generate.mjs
          cargo test --manifest-path swarm-tests/Cargo.toml --locked --tests -- --test-threads=2
          cargo run --manifest-path swarm-tests/Cargo.toml --locked --example data_demo -- demo/evidence
          python3 scripts/check-data-demo.py
      - name: Clippy
        run: |
          cargo clippy --manifest-path contract/Cargo.toml --locked --target wasm32-unknown-unknown
          cargo clippy --manifest-path swarm-tests/Cargo.toml --locked --all-targets
          cargo clippy --manifest-path data-escrow/Cargo.toml --locked --target wasm32-unknown-unknown -- -D warnings

  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check CLI verifier identity
        run: python3 scripts/sync-verifier-pin.py --check
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev cmake pkg-config libssl-dev libdbus-1-dev libudev-dev
      - name: Install B1 toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default 1.99.1
          cargo install cargo-near --version 0.23.0 --locked
      - name: Build and test CLI
        run: |
          cargo build --manifest-path cli/Cargo.toml --locked
          cargo test --manifest-path cli/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path cli/Cargo.toml --locked --all-targets
