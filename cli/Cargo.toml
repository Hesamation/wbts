[package]
name = "wbts-cli"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "cli"

[[bin]]
name = "cli"
path = "src/main.rs"

[[bin]]
name = "data-cli"
path = "src/data_main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
borsh = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
near-crypto = "=0.36.0"
near-primitives = "=0.36.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.dev]
debug = false
